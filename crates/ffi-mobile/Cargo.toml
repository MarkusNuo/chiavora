[package]
name = "chiavora-ffi-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# cdylib for the Swift/Kotlin consumers; rlib so the Rust-side tests link it.
[lib]
crate-type = ["cdylib", "rlib"]
name = "chiavora_ffi_mobile"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[lints]
workspace = true

[features]
# Off by default so it cannot ship; `scripts/gate.ps1` builds and tests it.
measurement-harness = []

[dependencies]
chiavora-core = { workspace = true }
uniffi = { version = "0.28", features = ["cli"] }
