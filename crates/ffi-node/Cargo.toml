[package]
name = "chiavora-ffi-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# cdylib for the Node addon; rlib so the Rust-side unit tests can link it.
[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
chiavora-core = { workspace = true }
napi = { version = "2.16", default-features = false, features = ["napi4"] }
napi-derive = "2.16"

[build-dependencies]
napi-build = "2.1"
