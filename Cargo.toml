[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/protocol",
    "crates/ffi-mobile",
    "crates/ffi-node",
    "crates/server",
    "apps/cli",
]

# The FFI crates allow `unsafe_code` locally, where the binding macros need it.
[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# These would let a panic or a silent truncation into code that handles key material.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"
cast_lossless = "warn"
missing_errors_doc = "allow"

# Versioned, because cargo-deny treats a path dependency without one as a wildcard.
[workspace.dependencies]
chiavora-core = { path = "crates/core", version = "0.1.0" }
chiavora-protocol = { path = "crates/protocol", version = "0.1.0" }

[workspace.package]
version = "0.1.0"
edition = "2021"
# Raised only as far as a dependency needs: crypto-bigint 0.7 needs 1.85.
rust-version = "1.85"
publish = false

# Only silences the failed-symbol prints napi-sys makes when a test binary loads it outside Node.
[profile.dev.package.napi-sys]
debug-assertions = false

# Per-package overrides are not inherited by `test`.
[profile.test.package.napi-sys]
debug-assertions = false
