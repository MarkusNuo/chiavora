plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ch.chiavora.core'
version = '0.1.0'

android {
  namespace 'ch.chiavora.core'
  // The module plugin ignores `rootProject.ext` here, and AGP's default is not installed.
  buildToolsVersion '36.0.0'

  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    ndk {
      abiFilters 'arm64-v8a'
    }
  }

  // Library and bindings are per variant: only the debug library has the measurement harness, so
  // release Kotlin has no binding for it. Both trees are generated by `scripts/mobile-native.ps1`.
  sourceSets {
    debug {
      java.srcDirs += ['src/debug/generated']
      kotlin.srcDirs += ['src/debug/generated']
      jniLibs.srcDirs += ['src/debug/jniLibs']
    }
    release {
      java.srcDirs += ['src/release/generated']
      kotlin.srcDirs += ['src/release/generated']
      jniLibs.srcDirs += ['src/release/jniLibs']
    }
  }
}

dependencies {
  // The `@aar` build carries JNA's native dispatcher for each ABI.
  implementation 'net.java.dev.jna:jna:5.19.1@aar'

  implementation 'androidx.biometric:biometric:1.1.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

  implementation 'androidx.lifecycle:lifecycle-process:2.8.7'

}
