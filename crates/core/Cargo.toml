[package]
name = "chiavora-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Exposes the null anchor `store::Unanchored` to tests; a release build needs a real anchor.
harness = []

[dependencies]
zeroize = { version = "1.8", features = ["zeroize_derive"] }
region = "3.0"
# The only randomness source in core.
getrandom = "0.3"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
subtle = "2.6"
chacha20poly1305 = "0.10"
chiavora-protocol = { workspace = true }
# `bundled` builds SQLite from source, so the file format does not depend on the platform.
rusqlite = { version = "0.32", features = ["bundled"] }
hmac = "0.12"
# NFC for the account password, which can arrive as NFC from one keyboard and NFD from another.
unicode-normalization = "0.1"
unicode-general-category = "1.0"
# Inflate only; `zip.rs` parses the container so it can refuse a high compression ratio.
miniz_oxide = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crypto-bigint = { version = "0.7.5", default-features = false, features = ["alloc", "zeroize"] }

[dev-dependencies]
# Turns `harness` on for integration tests, which build this crate without `cfg(test)`.
chiavora-core = { path = ".", features = ["harness"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets"] }
trybuild = "1.0"
proptest = "1.5"
# The RFC 5054 SRP test vectors use SHA-1.
sha1 = "0.11.0"
